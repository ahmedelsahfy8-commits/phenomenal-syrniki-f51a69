<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8" data-own="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-own="">
<title data-own="">دار الشام | مطعم وكافية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&amp;display=swap" data-own="">
<style data-own="">
:root{--bg:#FEF6E1;--card:#fffdf5;--ink:#4A2012;--org:#F08A0C;--org2:#d97700;--mut:#8a6a58;--line:#ead9b5;--soft:#fde7c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
#app{max-width:560px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:8px 0;min-height:52px}
.top h1{font-size:19px;margin:0;font-weight:800}
.ic{background:none;border:0;font-size:25px;color:var(--ink);cursor:pointer;position:relative;width:44px;height:40px}
.bd{position:absolute;top:0;left:2px;background:#d6203a;color:#fff;font:700 11px Cairo,sans-serif;border-radius:999px;min-width:18px;height:18px;line-height:18px}
.logo{width:116px;display:block;margin:0 auto 8px;border-radius:16px}
.s{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--mut);font:15px Cairo,sans-serif;margin-bottom:12px;cursor:pointer}
.of{display:flex;align-items:center;gap:12px;width:100%;background:var(--org);color:#fff;border:0;border-radius:16px;padding:12px 16px;font:800 18px Cairo,sans-serif;text-align:right;margin-bottom:12px;cursor:pointer}
.of small{display:block;font-weight:400;font-size:12px}.of i{font-style:normal;font-size:34px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px;font:700 16px Cairo,sans-serif;color:var(--ink);text-align:right;cursor:pointer}
.c:active,.of:active{transform:scale(.96)}
.th{flex:0 0 56px;width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:26px;font-style:normal;overflow:hidden}
.th img,.pic{width:100%;height:100%;object-fit:cover;display:block}
.big{display:block;width:100%;margin-top:14px;background:var(--org);color:#fff;border:0;border-radius:14px;padding:13px;font:800 17px Cairo,sans-serif;cursor:pointer}
.big.alt{background:var(--ink);color:var(--bg)}
h3{background:var(--org);color:#fff;margin:18px 0 4px;padding:5px 16px;border-radius:6px 20px 6px 20px;font-size:18px;font-weight:800}
.note{color:var(--mut);font-size:13px;margin:2px 4px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.it .l{display:flex;gap:10px;align-items:center;min-width:0}
.it .ph{flex:0 0 58px;width:58px;height:58px;border-radius:12px;overflow:hidden}
.it b{font-weight:600}.it small{display:block;color:var(--mut);font-size:12px;line-height:1.4}
.pr{display:flex;gap:6px;flex-shrink:0;align-items:center}
.p{background:var(--org);color:#fff;border:0;border-radius:10px;padding:5px 10px;font:700 15px Cairo,sans-serif;min-width:52px;cursor:pointer;line-height:1.2}
.p i{display:block;font:normal 11px Cairo,sans-serif;opacity:.9}
.p:active{transform:scale(.93)}
.ed{background:var(--soft);border:0;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:14px;color:var(--ink)}
.of2{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:10px 0}
.of2 .pic{height:150px}.of2 div{padding:10px 14px}
.of2 h4{margin:0;font-size:18px}.of2 p{margin:2px 0 8px;color:var(--mut);font-size:14px}
.pp{font-weight:800;font-size:20px;color:var(--org2)}.pp s{color:var(--mut);font-size:14px;font-weight:400;margin-inline-start:8px}
#q,.f input,.f textarea,.f select,.md input,.md textarea{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px Cairo,sans-serif;margin:5px 0}
.nav{position:fixed;inset:auto 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:25}
.nav button{background:none;border:0;color:var(--mut);font:600 12px Cairo,sans-serif;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:56px}
.nav button b{font-size:22px;font-weight:400;line-height:1.3}
.nav button.on{color:var(--org2)}
.nav .hm b{background:var(--org);color:#fff;width:54px;height:54px;border-radius:50%;line-height:54px;margin-top:-26px;border:4px solid var(--bg);font-size:24px}
.cr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.q button{width:32px;height:32px;border-radius:50%;border:0;background:var(--org);color:#fff;font-size:18px;cursor:pointer}
.q span{display:inline-block;min-width:26px;text-align:center;font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0}
.sm{display:flex;justify-content:space-between;color:var(--mut);margin:4px 0}
.ty{display:flex;gap:16px;margin:6px 0}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:600;width:100%;font-family:inherit;font-size:16px;text-align:right}
.row small{display:block;color:var(--mut);font-weight:400}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.eb{background:#d6203a;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:3px;border-radius:8px;margin-bottom:6px}
#ts{position:fixed;inset:auto 0 calc(96px + env(safe-area-inset-bottom,0px));text-align:center;z-index:70;pointer-events:none;opacity:0;transition:opacity .2s}
#ts span{background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-weight:600}
.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.md label{font-weight:600;font-size:14px;display:block;margin-top:6px}
.md .pv{width:100px;height:100px;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center;margin:6px 0}
.md .bt{display:flex;gap:8px;margin-top:10px}.md .bt button{flex:1}

body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg) center bottom/cover no-repeat;opacity:.16;pointer-events:none}

@media(min-width:700px){body::after{background-size:auto 100%}}
body.hm{padding-bottom:0}body.hm .top{display:none}
.sp{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 0 calc(34px + env(safe-area-inset-bottom,0px));color:#4A2012}
.sp .logo{width:min(74vw,290px);margin:0 auto;border-radius:0}
.sp .hi{font-size:21px;font-weight:600;margin:6px 0 14px}
.sp .big{width:min(78vw,300px);margin:0;box-shadow:0 4px 14px #f08a0c55}
.qk{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.qk button{background:#fffdf5cc;border:1px solid var(--line);color:#4A2012;border-radius:999px;padding:7px 14px;font:700 14px Cairo,sans-serif;cursor:pointer}
.sp .dm{margin-top:auto;font-size:22px;font-weight:800;padding-top:30px}

.sp{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);justify-content:center}
.hw{position:relative;width:100%;max-width:560px}
.hi2{display:block;width:100%;height:auto}
.sp .gb{position:absolute;top:70.8%;left:50%;transform:translateX(-50%);width:46%;margin:0;padding:9px 4px;font-size:clamp(14px,4.2vw,19px)}
body.hm::after{opacity:0}
body.hm{background:#fff9e1}
.hw{margin:0 -14px;width:calc(100% + 28px);max-width:588px}
.hi2{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent)}
.bn{display:block;width:100%;padding:0;border:0;border-radius:18px;overflow:hidden;margin:0 0 12px;background:#fff;box-shadow:0 6px 18px #4a201233;cursor:pointer}
.bn img{display:block;width:100%;height:auto}.bn:active{transform:scale(.98)}
.bn2{position:relative;display:flex;align-items:stretch;width:100%;min-height:150px;margin:6px 0 14px;padding:0;border:0;border-radius:24px;overflow:hidden;background:linear-gradient(120deg,#fff4da,#ffd9a3 66%,#f6a43a);box-shadow:0 10px 24px #f08a0c44;cursor:pointer;text-align:right;color:#4A2012;font-family:inherit}
.bn2:active{transform:scale(.98)}
.bn2 .tx{flex:1;position:relative;z-index:1;padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.bn2 b{display:block;font-size:clamp(19px,6vw,26px);line-height:1.35;font-weight:800}
.bn2 em{font-style:normal;color:#fff;background:#F08A0C;padding:0 9px;border-radius:7px;display:inline-block;transform:skew(-6deg)}
.bn2 .cta{align-self:flex-start;margin-top:8px;background:#4A2012;color:#fff;border-radius:999px;padding:4px 16px;font-size:14px;font-weight:700}
.bn2 .ch{width:52%;object-fit:cover;object-position:right center;-webkit-mask-image:linear-gradient(to left,#000 80%,transparent);mask-image:linear-gradient(to left,#000 80%,transparent)}

/* تحسين عرض الكمبيوتر والتابلت مع الحفاظ على شكل الموبايل */
@media (min-width: 760px){
  #app{max-width:1120px;padding:0 24px}
  .top h1{font-size:24px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .c{min-height:86px}
  .cat{max-width:100%}
  .nav{left:50%;right:auto;transform:translateX(-50%);width:min(760px,100%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}
  .md{width:min(620px,calc(100vw - 32px));max-height:85vh;overflow:auto}
  .row{gap:18px}
}
@media (max-width:420px){
  #app{padding-left:10px;padding-right:10px}
  .grid{gap:8px}
  .c{font-size:14px;padding:8px;gap:7px}
  .th{width:46px;height:46px;flex-basis:46px}
}


.status-best{display:inline-block;font-size:11px;font-weight:800;background:#fff0c9;color:#754d00;border-radius:20px;padding:3px 7px;margin:0 0 4px}
.status-unavailable{display:inline-block;font-size:12px;font-weight:700;color:#9d2929;background:#fde8e8;border-radius:8px;padding:5px 8px;margin-top:6px}
.is-unavailable{opacity:.86}
.prep-note{margin:10px 0}
.popular{border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0}
.popular h3{margin-top:4px}

async function commit(){
 try{
  localStorage.setItem('ds_site_data',JSON.stringify(D));
  localStorage.setItem('ds_site_cfg',JSON.stringify(CFG));
  try{const a=await window.claude.use('artifact');if(a){const c=SRC.cloneNode(true);c.querySelector('#cfg').textContent=JSON.stringify(D).replace(/</g,'\\u003c');await a.publish('<!DOCTYPE html>\\n'+c.outerHTML)}}catch(e){}
  toast('تم حفظ التعديلات على هذا الجهاز ✓');
 }catch(e){toast('تعذر الحفظ. مساحة التخزين قد تكون ممتلئة.')}
}
function toURI(f,max=640,q=.8,out='uri'){return new Promise((res,rej)=>{const fr=new FileReader;fr.onerror=()=>rej('read');fr.onload=()=>{const i=new Image;i.onerror=()=>rej('format');i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);out=='blob'?c.toBlob(b=>b?res(b):rej('blob'),'image/jpeg',q):res(c.toDataURL('image/jpeg',q))};i.src=fr.result};fr.readAsDataURL(f)})}
async function upImg(f){try{const as=await window.claude.use('assets');if(as){const r=await as.upload(await toURI(f,640,.8,'blob'));return '/_blob/'+r.id}}catch(e){}return toURI(f,320,.68)}
function modal(title,fields,onSave,onDel){const v={};fields.forEach(f=>v[f.k]=f.v??'');const o=document.createElement('div');o.className='ov';
 const draw=()=>{o.innerHTML=`<div class="md"><h3 style="margin:0 0 6px">${title}</h3>${fields.map(f=>f.t=='img'?`<label>${f.l}</label><div class="pv">${v[f.k]?`<img class="pic" src="${v[f.k]}" alt="">`:'🖼️'}</div><input type="file" accept="image/*" data-f="${f.k}">${v[f.k]?`<button class="ed" data-x="${f.k}">حذف الصورة</button>`:''}`:`<label>${f.l}</label>${f.t=='ta'?`<textarea rows="3" data-k="${f.k}">${esc(v[f.k])}</textarea>`:f.t=='sel'?`<select data-k="${f.k}">${f.options.map(o=>`<option value="${o.value}" ${String(v[f.k])===String(o.value)?'selected':''}>${o.label}</option>`).join('')}</select>`:`<input data-k="${f.k}" value="${esc(v[f.k])}" ${f.ph?`placeholder="${f.ph}"`:''}>`}`).join('')}<div class="bt"><button class="big" data-ok>حفظ</button>${onDel?`<button class="big alt" data-del>حذف</button>`:''}<button class="big alt" data-no>إلغاء</button></div></div>`};
 draw();o.onclick=async e=>{const t=e.target;if(t==o||t.dataset.no!==undefined)return o.remove();
  if(t.dataset.x){v[t.dataset.x]='';return draw()}
  if(t.dataset.del!==undefined){o.remove();onDel();return commit()}
  if(t.dataset.ok!==undefined){o.querySelectorAll('[data-k]').forEach(i=>v[i.dataset.k]=i.value);o.remove();onSave(v);commit()}};
 o.onchange=async e=>{const t=e.target;if(t.dataset.f&&t.files[0]){o.querySelectorAll('[data-k]').forEach(i=>v[i.dataset.k]=i.value);toast('جاري رفع الصورة...');try{v[t.dataset.f]=await upImg(t.files[0]);toast('تم رفع الصورة ✓')}catch(er){toast('الصورة دي مش مدعومة، جرب صورة JPG أو PNG')}draw()}};
 document.body.appendChild(o)}

function askPin(title,hint,fs,ok){const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="md"><h3 style="margin:0 0 6px">${title}</h3>${hint?`<p class="note">${hint}</p>`:''}${fs.map(f=>`<label>${f[1]}</label><input type="password" inputmode="text" autocomplete="off" data-p="${f[0]}">`).join('')}<div class="bt"><button class="big" data-ok>تأكيد</button><button class="big alt" data-no>إلغاء</button></div></div>`;
 o.onclick=e=>{const t=e.target;if(t==o||t.dataset.no!==undefined)return o.remove();if(t.dataset.ok!==undefined){const v={};o.querySelectorAll('[data-p]').forEach(i=>v[i.dataset.p]=i.value);o.remove();ok(v)}};
 document.body.appendChild(o)}
function productRow(ci,gi,j,it,g){
 const flavorButtons=(k,p)=>it.spice?['عادي','حار'].map(fl=>`<button class="p" data-k="${ci}.${gi}.${j}.${k}" data-spice="${fl}">${g.cols[k]?`<i>${esc(g.cols[k])}</i>`:''}${fl} · ${p}</button>`).join(''):`<button class="p" data-k="${ci}.${gi}.${j}.${k}">${g.cols[k]?`<i>${esc(g.cols[k])}</i>`:''}${p}</button>`;
 const status=it.available===false?'<span class="status-unavailable">غير متاح حاليًا</span>':'';
 return `<div class="it ${it.available===false?'is-unavailable':''}" data-s="${esc(it.n+' '+(it.d||''))}"><div class="l">${it.img?`<div class="ph"><img class="pic" src="${it.img}" alt="${esc(it.n)}"></div>`:''}<div>${it.best?'<span class="status-best">⭐ الأكثر طلبًا</span>':''}<b>${esc(it.n)}</b>${it.d?`<small>${esc(it.d)}</small>`:''}${status}</div></div><div class="pr">${EDIT?`<button class="ed" data-ei="${ci}.${gi}.${j}">✏️</button>`:''}${it.available===false?'':it.p.map((p,k)=>p==null?'':flavorButtons(k,p)).join('')}</div></div>`;
}
function groups(ci){return cats[ci].g.map((g,gi)=>`<section>${g.t?`<h3>${esc(g.t)}</h3>`:''}${(g.notes||[]).map(n=>`<p class="note">${esc(n)}</p>`).join('')}${g.items.map((it,j)=>productRow(ci,gi,j,it,g)).join('')}${EDIT?`<button class="big alt" data-ai="${ci}.${gi}">+ إضافة صنف</button>`:''}</section>`).join('')}
function popularItems(){
 const found=[];
 cats.forEach((c,ci)=>c.g.forEach((g,gi)=>g.items.forEach((it,j)=>{if(it.best)found.push({ci,gi,j,it,g})})));
 if(!found.length)return EDIT?'<div class="row"><span>مفيش أصناف محددة كالأكثر طلبًا بعد.</span><small>افتح تعديل أي صنف وفعّل «الأكثر طلبًا».</small></div>':'';
 return `<section class="popular"><h3>⭐ الأكثر طلبًا</h3>${found.map(x=>productRow(x.ci,x.gi,x.j,x.it,x.g)).join('')}</section>`;
}
